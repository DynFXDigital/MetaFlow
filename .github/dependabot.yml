version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /src
      - /packages/engine
      - /packages/cli
    schedule:
      interval: weekly
      day: monday
    # Keep routine version upgrades in an intentional maintenance window.
    open-pull-requests-limit: 0
    labels:
      - dependencies
    groups:
      npm-security-updates:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Keep routine action upgrades in an intentional maintenance window.
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: 'chore(deps)'
      include: scope
    groups:
      github-actions-security-updates:
        applies-to: security-updates
        patterns:
          - '*'
