name: Nightly Full Gate

on:
  schedule:
    - cron: '30 8 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-gate:
    name: Full gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure xvfb is available
        shell: bash
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - name: Full gate (headless)
        shell: bash
        run: xvfb-run -a npm run gate:full

      - name: GUI tests (headless)
        env:
          METAFLOW_GUI_READY_TIMEOUT_MS: '90000'
        run: xvfb-run -a npm -w metaflow-ai run test:gui

      - name: Upload GUI diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-gui-diagnostics-${{ github.run_id }}
          path: |
            src/.vscode-test/gui/screenshots/
            src/.vscode-test/gui/**/*.log
          if-no-files-found: ignore
