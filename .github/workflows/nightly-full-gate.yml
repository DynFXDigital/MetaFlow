name: Nightly Full Gate

on:
  schedule:
    - cron: '30 8 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-gate:
    name: Full gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure xvfb is available
        shell: bash
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - name: Full gate (headless)
        shell: bash
        run: xvfb-run -a npm run gate:full

      - name: GUI tests (headless)
        env:
          METAFLOW_GUI_READY_TIMEOUT_MS: '90000'
        run: xvfb-run -a npm -w metaflow-ai run test:gui

      - name: Upload GUI diagnostics
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: nightly-gui-diagnostics-${{ github.run_id }}
          path: |
            src/.vscode-test/gui/screenshots/
            src/.vscode-test/gui/**/*.log
          if-no-files-found: ignore
