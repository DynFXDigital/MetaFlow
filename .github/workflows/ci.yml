name: CI

on:
  pull_request:
    branches:
      - main
      - prerelease
      - develop
      - release/**
  push:
    branches:
      - main
      - prerelease
      - develop
      - release/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-unit:
    name: Lint, build, and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Formatting check
        run: npx prettier .github --check

      - name: Build workspace
        run: npm run build

      - name: Lint (blocking on release branches)
        if: >
          (github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'prerelease' || startsWith(github.base_ref, 'release/'))) ||
          (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'prerelease' || startsWith(github.ref_name, 'release/')))
        run: npm -w metaflow-ai run lint

      - name: Lint (advisory on develop)
        id: lint_advisory
        if: >
          (github.event_name == 'pull_request' && github.base_ref == 'develop') ||
          (github.event_name == 'push' && github.ref_name == 'develop')
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm -w metaflow-ai run lint:monitor
          lint_exit=$?
          npm -w metaflow-ai run lint:summary
          exit $lint_exit

      - name: Lint advisory notice
        if: steps.lint_advisory.outcome == 'failure'
        run: echo "::warning::Lint issues detected on develop. This is non-blocking on develop but blocks on release branches."

      - name: Unit tests
        run: npm run test

      - name: Ensure xvfb is available
        shell: bash
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - name: Integration gate (headless)
        shell: bash
        run: xvfb-run -a npm run gate:integration

      - name: Package smoke
        shell: bash
        run: |
          if [ "${{ github.base_ref }}" = "prerelease" ] || [ "${{ github.ref_name }}" = "prerelease" ]; then
            npm -C src run package:pre
          else
            npm -C src run package:stable
          fi

  gui-tests:
    name: GUI tests (vscode-extension-tester)
    runs-on: ubuntu-latest
    needs: build-and-unit
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install xvfb
        run: sudo apt-get install -y xvfb

      - name: Build, bundle, and package for GUI tests
        run: npm -w metaflow-ai run pretest:gui

      - name: Run GUI tests (headless, advisory)
        id: gui_advisory
        continue-on-error: true
        run: xvfb-run -a npm -w metaflow-ai run test:gui

      - name: GUI advisory notice
        if: steps.gui_advisory.outcome == 'failure'
        run: echo "::warning::GUI test issues detected. This is non-blocking until the GUI harness is stable enough for branch protection."
