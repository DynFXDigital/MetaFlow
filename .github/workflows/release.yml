name: Release Extension

# Releasing is an explicit deployment decision.
# Trigger this manually once the version PR has merged on the correct lane and that branch is at the intended version.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel'
        required: true
        type: choice
        options: [stable, prerelease]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify and package (${{ inputs.channel }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      vsix_name: ${{ steps.vsix.outputs.vsix_name }}
      branch_name: ${{ steps.branch.outputs.branch_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Resolve branch name
        id: branch
        shell: bash
        run: |
          BRANCH_NAME="${GITHUB_REF_NAME}"
          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          echo "Running release workflow from branch $BRANCH_NAME"

      - name: Install dependencies
        run: npm ci

      - name: Read version from package
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./src/package.json').version")
          TAG="v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION on channel ${{ inputs.channel }}"

      - name: Enforce branch and version lane rules
        shell: bash
        run: |
          BRANCH_NAME="${{ steps.branch.outputs.branch_name }}"
          VERSION="${{ steps.version.outputs.version }}"
          MINOR="$(echo "$VERSION" | cut -d. -f2)"

          if [ "${{ inputs.channel }}" = "prerelease" ]; then
            if [ "$BRANCH_NAME" != "prerelease" ]; then
              echo "Prerelease publishes must run from the prerelease branch, not $BRANCH_NAME."
              exit 1
            fi
            if [ $((MINOR % 2)) -ne 1 ]; then
              echo "Prerelease publishes require an odd minor version; got $VERSION."
              exit 1
            fi
          else
            case "$BRANCH_NAME" in
              main|release/*) ;;
              *)
                echo "Stable publishes must run from main or release/*, not $BRANCH_NAME."
                exit 1
                ;;
            esac
            if [ $((MINOR % 2)) -ne 0 ]; then
              echo "Stable publishes require an even minor version; got $VERSION."
              exit 1
            fi
          fi

      - name: Verify required CI passed for release SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          required_checks=(
            "Lint, build, and unit tests"
          )

          check_runs_json="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100")"
          missing=0

          for check_name in "${required_checks[@]}"; do
            conclusion="$(jq -r --arg name "$check_name" '
              [.check_runs[] | select(.name == $name)]
              | sort_by(.completed_at // "")
              | last
              | .conclusion // empty
            ' <<< "$check_runs_json")"

            if [ "$conclusion" != "success" ]; then
              echo "::error::Required check '$check_name' did not pass for ${GITHUB_SHA} (conclusion: ${conclusion:-missing})."
              missing=1
            else
              echo "Required check passed: $check_name"
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "Run release only after required branch CI is green for the exact release commit."
            exit 1
          fi

      - name: Package extension
        id: vsix
        shell: bash
        run: |
          if [ "${{ inputs.channel }}" = "prerelease" ]; then
            npm -C src run package:pre
          else
            npm -C src run package:stable
          fi
          VSIX_PATH="$(find src/artifacts -name '*.vsix' | head -1)"
          if [ -z "$VSIX_PATH" ]; then
            echo "No VSIX found in src/artifacts/."
            exit 1
          fi
          VSIX_NAME="$(basename "$VSIX_PATH")"
          echo "vsix_name=$VSIX_NAME" >> "$GITHUB_OUTPUT"
          echo "Packaged: $VSIX_NAME"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.vsix.outputs.vsix_name }}
          path: src/artifacts/*.vsix
          retention-days: 30

  publish:
    name: Publish (${{ inputs.channel }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Requires a GitHub Environment named 'production' (stable) or 'prerelease'.
    # Add required reviewers on these environments for a manual approval gate.
    environment: ${{ inputs.channel == 'stable' && 'production' || 'prerelease' }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download VSIX artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.verify.outputs.vsix_name }}
          path: artifacts

      - name: Resolve downloaded VSIX path
        id: downloaded_vsix
        shell: bash
        run: |
          VSIX_PATH="$(find artifacts -name '*.vsix' | head -1)"
          if [ -z "$VSIX_PATH" ]; then
            echo "No VSIX found after artifact download."
            find artifacts -maxdepth 3 -type f
            exit 1
          fi
          ABS_VSIX_PATH="$GITHUB_WORKSPACE/$VSIX_PATH"
          echo "vsix_path=$ABS_VSIX_PATH" >> "$GITHUB_OUTPUT"
          echo "Downloaded VSIX: $ABS_VSIX_PATH"

      - name: Detect publish targets
        id: targets
        shell: bash
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          has_vsce=false
          has_ovsx=false
          [ -n "$VSCE_PAT" ] && has_vsce=true || echo "::warning::VSCE_PAT not set; skipping VS Code Marketplace."
          [ -n "$OVSX_PAT" ] && has_ovsx=true || echo "::warning::OVSX_PAT not set; skipping Open VSX."
          [ "$has_vsce" = false ] && [ "$has_ovsx" = false ] && echo "::warning::No marketplace secrets configured; VSIX available as artifact only."
          echo "vsce=$has_vsce" >> "$GITHUB_OUTPUT"
          echo "ovsx=$has_ovsx" >> "$GITHUB_OUTPUT"

      - name: Publish to VS Code Marketplace
        if: steps.targets.outputs.vsce == 'true'
        shell: bash
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          PRE_FLAG=""
          [ "${{ inputs.channel }}" = "prerelease" ] && PRE_FLAG="--pre-release"
          npm exec --workspace src vsce -- publish \
            $PRE_FLAG \
            --packagePath "${{ steps.downloaded_vsix.outputs.vsix_path }}" \
            --skip-duplicate \
            -p "$VSCE_PAT"

      - name: Publish to Open VSX
        if: steps.targets.outputs.ovsx == 'true'
        shell: bash
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          PRE_FLAG=""
          [ "${{ inputs.channel }}" = "prerelease" ] && PRE_FLAG="--pre-release"
          npx ovsx publish \
            "${{ steps.downloaded_vsix.outputs.vsix_path }}" \
            $PRE_FLAG \
            --skip-duplicate \
            -p "$OVSX_PAT"

      - name: Create and push release tag
        shell: bash
        run: |
          TAG="${{ needs.verify.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; skipping."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
            echo "Created tag $TAG"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ needs.verify.outputs.tag }}"
          EXTRA=""
          [ "${{ inputs.channel }}" = "prerelease" ] && EXTRA="--prerelease"
          VSIX_PATH="${{ steps.downloaded_vsix.outputs.vsix_path }}"

          run_with_retry() {
            local attempt=1
            local max_attempts=5
            local delay_seconds=5

            while true; do
              if "$@"; then
                return 0
              fi

              local exit_code=$?
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "::error::Command failed after ${max_attempts} attempts: $*"
                return "$exit_code"
              fi

              echo "::warning::Command failed with exit code ${exit_code}: $*"
              echo "Retrying in ${delay_seconds}s (attempt ${attempt}/${max_attempts})..."
              sleep "$delay_seconds"
              attempt=$((attempt + 1))
              delay_seconds=$((delay_seconds * 2))
            done
          }

          release_status() {
            local output_file
            output_file="$(mktemp)"

            if gh release view "$TAG" >"$output_file" 2>&1; then
              rm -f "$output_file"
              echo "exists"
              return 0
            fi

            local view_output
            view_output="$(cat "$output_file")"
            rm -f "$output_file"

            if grep -Eiq "(not found|HTTP 404|status code: 404)" <<< "$view_output"; then
              echo "missing"
              return 0
            fi

            echo "$view_output"
            return 1
          }

          status=""
          for attempt in 1 2 3 4 5; do
            if status="$(release_status)"; then
              break
            fi

            if [ "$attempt" -eq 5 ]; then
              echo "::error::Unable to determine whether GitHub Release $TAG exists after ${attempt} attempts."
              echo "$status"
              exit 1
            fi

            echo "::warning::Unable to determine whether GitHub Release $TAG exists:"
            echo "$status"
            sleep $((5 * attempt))
          done

          if [ "$status" = "exists" ]; then
            run_with_retry gh release upload "$TAG" "$VSIX_PATH" --clobber
          elif [ "$status" = "missing" ]; then
            run_with_retry gh release create "$TAG" \
              "$VSIX_PATH" \
              --verify-tag \
              --title "$TAG" \
              --generate-notes \
              $EXTRA
          else
            echo "::error::Unexpected release status for $TAG: $status"
            exit 1
          fi
