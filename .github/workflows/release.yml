name: Release Extension

# Merging to main proves source quality; releasing is an explicit deployment decision.
# Trigger this manually once the version PR has merged and main is at the correct version.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: true
        type: choice
        options: [stable, prerelease]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify and package (${{ inputs.channel }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      vsix_name: ${{ steps.vsix.outputs.vsix_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read version from package
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./src/package.json').version")
          TAG="v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION on channel ${{ inputs.channel }}"

      - name: Quick gate
        run: npm run gate:quick

      - name: Ensure xvfb is available
        shell: bash
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y xvfb
          fi

      - name: Integration gate (headless)
        shell: bash
        run: xvfb-run -a npm run gate:integration

      - name: Package extension
        id: vsix
        shell: bash
        run: |
          if [ "${{ inputs.channel }}" = "prerelease" ]; then
            npm -C src run package:pre
          else
            npm -C src run package:stable
          fi
          VSIX_PATH="$(find src/artifacts -name '*.vsix' | head -1)"
          if [ -z "$VSIX_PATH" ]; then
            echo "No VSIX found in src/artifacts/."
            exit 1
          fi
          VSIX_NAME="$(basename "$VSIX_PATH")"
          echo "vsix_name=$VSIX_NAME" >> "$GITHUB_OUTPUT"
          echo "Packaged: $VSIX_NAME"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.vsix.outputs.vsix_name }}
          path: src/artifacts/*.vsix
          retention-days: 30

  publish:
    name: Publish (${{ inputs.channel }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Requires a GitHub Environment named 'production' (stable) or 'prerelease'.
    # Add required reviewers on these environments for a manual approval gate.
    environment: ${{ inputs.channel == 'stable' && 'production' || 'prerelease' }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download VSIX artifact
        uses: actions/download-artifact@v8  # pin to commit hash: see actions/download-artifact releases
        with:
          name: ${{ needs.verify.outputs.vsix_name }}
          path: artifacts

      - name: Detect publish targets
        id: targets
        shell: bash
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          has_vsce=false
          has_ovsx=false
          [ -n "$VSCE_PAT" ] && has_vsce=true || echo "::warning::VSCE_PAT not set; skipping VS Code Marketplace."
          [ -n "$OVSX_PAT" ] && has_ovsx=true || echo "::warning::OVSX_PAT not set; skipping Open VSX."
          [ "$has_vsce" = false ] && [ "$has_ovsx" = false ] && echo "::warning::No marketplace secrets configured; VSIX available as artifact only."
          echo "vsce=$has_vsce" >> "$GITHUB_OUTPUT"
          echo "ovsx=$has_ovsx" >> "$GITHUB_OUTPUT"

      - name: Publish to VS Code Marketplace
        if: steps.targets.outputs.vsce == 'true'
        shell: bash
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          PRE_FLAG=""
          [ "${{ inputs.channel }}" = "prerelease" ] && PRE_FLAG="--pre-release"
          npm exec --workspace src vsce -- publish \
            $PRE_FLAG \
            --packagePath "artifacts/${{ needs.verify.outputs.vsix_name }}" \
            --skip-duplicate \
            -p "$VSCE_PAT"

      - name: Publish to Open VSX
        if: steps.targets.outputs.ovsx == 'true'
        shell: bash
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          PRE_FLAG=""
          [ "${{ inputs.channel }}" = "prerelease" ] && PRE_FLAG="--pre-release"
          npx ovsx publish \
            "artifacts/${{ needs.verify.outputs.vsix_name }}" \
            $PRE_FLAG \
            --skip-duplicate \
            -p "$OVSX_PAT"

      - name: Create and push release tag
        shell: bash
        run: |
          TAG="${{ needs.verify.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; skipping."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
            echo "Created tag $TAG"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ needs.verify.outputs.tag }}"
          EXTRA=""
          [ "${{ inputs.channel }}" = "prerelease" ] && EXTRA="--prerelease"
          VSIX_PATH="artifacts/${{ needs.verify.outputs.vsix_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$VSIX_PATH" --clobber
          else
            gh release create "$TAG" \
              "$VSIX_PATH" \
              --verify-tag \
              --title "$TAG" \
              --generate-notes \
              $EXTRA
          fi
